exchange:
  name: binance
  trading_pair: BTCUSDT
  mode: paper  # 'paper' or 'live'

strategy:
  check_interval_seconds: 60
  primary_timeframe: 15m
  trend_timeframe: 4h      # For 200-MA long-term trend
  indicator_period: 200

signals:
  dip_mild_pct: 3.0
  dip_moderate_pct: 5.0
  dip_major_pct: 10.0
  rsi_oversold: 30
  rsi_extremely_oversold: 20
  rsi_period: 14
  ma_short_period: 20
  ma_long_period: 200
  bollinger_period: 20
  bollinger_std: 2.0
  volume_decline_threshold: 0.8

scoring:
  buy_threshold: 60
  small_buy_range: [60, 74]
  medium_buy_range: [75, 84]
  large_buy_range: [85, 100]
  small_buy_pct: 0.05
  medium_buy_pct: 0.10
  large_buy_pct: 0.20

dca:
  tranches: 3
  min_interval_minutes: 10
  max_interval_minutes: 60

selling:
  profit_target_pct: 5.0
  trailing_stop_pct: 1.0
  time_exit_days: 7

risk:
  max_position_pct: 0.20
  max_total_exposure_pct: 0.70
  stop_loss_pct: 5.0
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 10.0
  cooldown_after_stoploss_hours: 4
  sentiment_block_hours: 12

llm:
  provider: anthropic
  model: claude-sonnet-4-5-20250929
  trigger_threshold: 40
  max_calls_per_hour: 10

news:
  provider: cryptopanic
  max_headlines: 10

fees:
  maker_pct: 0.10
  taker_pct: 0.10
  estimated_slippage_pct: 0.05

capital:
  initial_usdt: 1000.0
